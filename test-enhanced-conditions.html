<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Conditions Enhanced Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Core Conditions Enhanced System Test</h1>
    
    <div id="test-results"></div>
    
    <div id="condition-details" style="margin-top: 20px;"></div>

    <script type="module">
        import { CoreConditionsManager } from './static/js/v2/modules/CoreConditionsManager.js';

        const results = document.getElementById('test-results');
        const details = document.getElementById('condition-details');

        function addResult(type, title, message) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}</strong><br>${message}`;
            results.appendChild(div);
        }

        async function runTests() {
            const manager = new CoreConditionsManager();
            
            try {
                // Test 1: Initialize manager
                addResult('info', 'Test 1: Initializing', 'Starting CoreConditionsManager...');
                const initResult = await manager.initialize();
                
                if (initResult.success) {
                    addResult('success', 'Initialization Success', 
                        `Legacy stats: ${JSON.stringify(initResult.stats, null, 2)}`);
                } else {
                    addResult('error', 'Initialization Failed', 'Could not initialize manager');
                    return;
                }

                // Test 2: Check for enhanced content
                const hasEnhanced = manager.hasEnhancedContent();
                addResult(hasEnhanced ? 'success' : 'info', 
                    'Test 2: Enhanced Content Check', 
                    hasEnhanced ? 'Enhanced content is available!' : 'Enhanced content not yet available (run generation first)');

                if (hasEnhanced) {
                    // Test 3: Load enhanced stats
                    const enhancedStats = manager.getEnhancedStats();
                    addResult('success', 'Test 3: Enhanced Stats', 
                        `Total conditions: ${enhancedStats.totalConditions}<br>Generated: ${enhancedStats.generatedAt}<br>Cached: ${enhancedStats.cached}`);

                    // Test 4: Try to load a condition
                    try {
                        const condition = await manager.getEnhancedCondition('Acute pain management');
                        if (condition) {
                            addResult('success', 'Test 4: Load Enhanced Condition', 
                                `Successfully loaded "${condition.name}"`);
                            
                            // Show condition details
                            details.innerHTML = `
                                <h2>Sample Enhanced Condition: ${condition.name}</h2>
                                <p><strong>Domains:</strong> ${condition.domains.join(', ')}</p>
                                <h3>Drug Information Sample:</h3>
                                <pre>${JSON.stringify(condition.content.management.drugs[0] || {}, null, 2)}</pre>
                                <h3>Foundation Doctor Role:</h3>
                                <p>${condition.content.foundationDoctorRole}</p>
                            `;
                        } else {
                            addResult('info', 'Test 4: Load Enhanced Condition', 
                                'No enhanced condition found (expected if not generated yet)');
                        }
                    } catch (error) {
                        addResult('error', 'Test 4: Load Enhanced Condition Failed', error.message);
                    }
                }

                // Test 5: Search functionality
                try {
                    const searchResults = manager.searchEnhancedConditions('pain');
                    addResult('success', 'Test 5: Search Enhanced Conditions', 
                        `Found ${searchResults.length} results for "pain"`);
                } catch (error) {
                    addResult('error', 'Test 5: Search Failed', error.message);
                }

            } catch (error) {
                addResult('error', 'Test Failed', error.message);
            }
        }

        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
